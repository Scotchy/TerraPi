map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    location = /terra { return 301 /terra/; }
    location = /terra/mqtt {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $broker broker:9002;
        proxy_pass http://$broker/mqtt;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1d;
    }
    location = /terra/api/monitoring/history {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $monitoring monitoring:8081;
        proxy_set_header Cookie "";
        proxy_buffering off;
        proxy_pass http://$monitoring;
    }
    location /terra/api/ { return 404; }
    location /terra/releases/ {
        alias /srv/releases/;
        autoindex off;
        add_header Cache-Control "no-store";
    }
    location /terra/static/ {
        try_files $uri @old_assets;
    }
    location @old_assets {
        root /srv/previous;
        try_files $uri =404;
    }
    location /terra/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /terra/index.html;
    }
    location / { return 404; }
}
