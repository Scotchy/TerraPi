name: Provision VPS deploy helper
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Check monitoring support or install the helper from main
        type: choice
        options: [check, install]
        default: check

permissions:
  contents: read

concurrency:
  group: terrapi-production
  cancel-in-progress: false

jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production-vps-provisioning
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check or install the monitoring deployment helper
        env:
          OPERATION: ${{ inputs.operation }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_ADMIN_USER: ${{ secrets.VPS_ADMIN_USER }}
          VPS_ADMIN_KEY: ${{ secrets.VPS_ADMIN_KEY }}
        run: bash deploy/ci/provision_vps.sh "$OPERATION"
