persistence true
persistence_location /mosquitto/data/
log_dest stdout
allow_anonymous false
password_file /run/broker/passwords
acl_file /run/broker/acl

listener 1883
protocol mqtt
certfile /run/broker/chain.pem
keyfile /run/broker/key.pem

listener 9001
protocol websockets
certfile /run/broker/chain.pem
keyfile /run/broker/key.pem

# Internal WebSocket upstream. Docker does not publish this port.
listener 9002
protocol websockets
